  <text x="48" y="83" fill="#abbac3" font-family="Arial, Helvetica, sans-serif" font-size="14">A project map, not a claim of product maturity</text>
  <line x1="48" y1="103" x2="1152" y2="103" stroke="#36505e" stroke-width="1"/>

  <rect x="48" y="126" width="346" height="306" rx="7" fill="#192936" stroke="#46606a"/>
