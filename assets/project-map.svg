<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc">
  <title id="title">Selected work by problem area</title>
  <desc id="desc">Developer systems: Cortex and Context Stamps. Operational systems: Saarthi, MerchantBot, and TradeOn. Creative tools: ToneLoom and ChromaTime. All connect to context, bounded decisions, and evaluation.</desc>
  <rect width="1200" height="550" fill="#111c27"/>
